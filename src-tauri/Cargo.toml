[package]
name = "leenote"
version = "0.1.12"
description = "A lightweight Markdown sticky note app"
authors = ["LeeNote"]
edition = "2021"

[lib]
name = "leenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
rfd = "0.15"
